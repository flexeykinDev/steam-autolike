name: Release

# Push a tag like v2.0.0 — or press "Run workflow" (the tag v<manifest version> is created for you) —
# → tests, lint, build, optional AMO signing, GitHub Release with the .xpi.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint

      - name: Work out the tag
        run: |
          v=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != manifest version $v"; exit 1; }
          fi
          echo "TAG=v$v" >> "$GITHUB_ENV"
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Build unsigned .xpi
        run: npm run build

      # Optional: add AMO_JWT_ISSUER / AMO_JWT_SECRET repository secrets
      # (addons.mozilla.org → Developer Hub → Manage API Keys) to get a signed build
      # that installs permanently in regular Firefox.
      - name: Sign on AMO (unlisted)
        if: env.AMO_JWT_ISSUER != ''
        run: |
          npx web-ext sign --source-dir . --channel unlisted --artifacts-dir dist-signed \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" --approval-timeout 900000
          for f in dist-signed/*.xpi; do mv "$f" "dist/steam-autolike-${VERSION}-signed.xpi"; done

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Steam Autolike $TAG" > notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.xpi --clobber
          else
            gh release create "$TAG" dist/*.xpi --target "$GITHUB_SHA" --title "Steam Autolike $TAG" --notes-file notes.md
          fi
