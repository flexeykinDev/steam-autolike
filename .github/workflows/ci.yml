name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: web-ext lint
        run: npm run lint
      - name: Build .xpi
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: steam-autolike-xpi
          path: dist/*.xpi
